    <main class="fondo-contacto">
        <h1>¡Únete a Thinsty!</h1>
        <p>Crea tu cuenta para formar parte de nuestra comunidad.</p>

      <form id="formRegistro" class="mx-auto" style="max-width: 500px;">

    <div class="mb-3">
        <label for="nombre" class="form-label">Nombre completo</label>
        <input type="text" class="form-control" id="nombre"
               name="nombre" placeholder="Escribe tu nombre" required>
    </div>

    <div class="mb-3">
        <label for="correo" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="correo"
               name="correo" placeholder="ejemplo@correo.com" required>
    </div>

    <div class="mb-3">
        <label for="contrasena" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="contrasena"
               name="contrasena" minlength="8"
               placeholder="Mínimo 8 caracteres" required>
    </div>

    <div class="mb-3">
        <label for="confirmar" class="form-label">Confirmar contraseña</label>
        <input type="password" class="form-control" id="confirmar"
               name="confirmar" minlength="8"
               placeholder="Escribe tu contraseña otra vez" required>
    </div>

    <button type="submit" class="btn boton-rosa">Crear cuenta</button>

</form>
    </main>
